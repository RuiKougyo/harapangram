# 無料の Supabase は7日間アクセスがないと休止するので、3日ごとに軽くアクセスします。
# GitHub は60日間更新のないリポジトリの定期実行を止めるため、月に1回だけ小さなファイルを更新します。
# 必要な設定: リポジトリの Settings → Secrets and variables → Actions → Variables に
#   SUPABASE_URL と SUPABASE_ANON_KEY を登録（config.js と同じ値）
name: keep-alive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "SUPABASE_URL / SUPABASE_ANON_KEY が未設定です"; exit 1; }
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d "{}"
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit (first run of each month)
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$(date -u +%d)" -gt 3 ] && [ "$EV" != "workflow_dispatch" ]; then exit 0; fi
          date -u +%FT%TZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep-alive heartbeat" || exit 0
          git push
